<section class="section newsletter" id="newsletter">
        <div class="container">
          <div class="nl-eyebrow reveal">Subscribe</div>
          <h2 class="nl-title reveal">
            To our newsletter to get the latest updates and insights
          </h2>
          <form class="nl-form reveal" id="nlForm">
            <div class="nl-row">
              <input
                class="nl-input"
                type="email"
                placeholder="Your email"
                required
              />
              <button type="submit" class="nl-submit" aria-label="Subscribe">
                <svg viewBox="0 0 14 14" fill="none">
                  <path
                    d="M1 7H13M13 7L8 2M13 7L8 12"
                    stroke="currentColor"
                    stroke-width="1.4"
                  />
                </svg>
              </button>
            </div>
            <label class="nl-check"
              ><input type="checkbox" required /> By sending my details, I have
              read and accept the <span class="pending-link">Privacy policy (pending)</span></label
            >
            <p class="nl-msg" id="nlMsg">Thanks — you're on the list.</p>
          </form>
        </div>
      </section>
