<article class="member-card">
  {% if member.photo %}<img class="avatar" src="{{ member.photo.url }}" alt="{{ member.name }}" />{% elif member.photo_url %}<img class="avatar" src="{{ member.photo_url }}" alt="{{ member.name }}" />{% else %}<div class="avatar" aria-hidden="true"></div>{% endif %}
  <div><h4>{{ member.name }}</h4><div class="role">{{ member.role }}</div></div>
  {% if member.bio %}<p>{{ member.bio }}</p>{% endif %}
</article>
